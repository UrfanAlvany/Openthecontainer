<title>Dockside</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&family=Big+Shoulders+Stencil+Display:wght@700;800&display=swap">
<style>
/* Layout: a night-shift port office. Left: the stage (auction lots or the open container).
   Right: the clipboard (upgrades, collections, log). Single dark world under sodium lamps. */
:root {
  --night: #0e1a22;        /* harbour at night */
  --steel: #16252f;        /* panel steel */
  --steel-hi: #1f323e;     /* raised steel */
  --line: #2c4250;         /* weld seams */
  --fog: #d5dfe3;          /* text under lamps */
  --muted: #8a9ca8;        /* stencil grey */
  --sodium: #ffae42;       /* sodium floodlight: the one accent */
  --sodium-ink: #2a1a05;
  --gain: #5bd68e;
  --loss: #ff6f5e;
  --r-junk: #8a8f98; --r-common: #5fbf6a; --r-rare: #3d8bff; --r-epic: #b05cff; --r-legendary: #ffb020;
  --font-display: "Big Shoulders Stencil Display", "Impact", "Arial Narrow", sans-serif;
  --font-body: "Barlow", "Segoe UI", system-ui, sans-serif;
  --font-num: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --radius: 6px;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background:
    radial-gradient(1200px 500px at 70% -10%, rgba(255, 174, 66, .10), transparent 60%),
    var(--night);
  color: var(--fog);
  font: 15px/1.45 var(--font-body);
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--sodium); outline-offset: 2px; }

.app { max-width: 1280px; margin: 0 auto; padding-inline: 16px; padding-block: 12px 32px; display: flex; flex-direction: column; gap: 14px; }

/* ---------------------------------------------------------------- top bar */
.topbar { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; border-bottom: 1px solid var(--line); padding-block: 4px 12px; }
.brand { font-family: var(--font-display); font-weight: 800; font-size: 30px; letter-spacing: .06em; color: var(--sodium); line-height: 1; }
.brand small { display: block; font-family: var(--font-num); font-weight: 600; font-size: 11px; letter-spacing: .18em; color: var(--muted); margin-top: 4px; }
.cash { margin-left: auto; display: flex; gap: 22px; align-items: flex-end; flex-wrap: wrap; }
.stat { display: flex; flex-direction: column; align-items: flex-end; }
.stat .label { font-family: var(--font-num); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.stat .value { font-family: var(--font-num); font-weight: 700; font-size: 22px; font-variant-numeric: tabular-nums; line-height: 1.1; }
.stat.money .value { font-size: 34px; color: var(--fog); }
.stat.money .value.bump { animation: bump .35s ease-out; }
@keyframes bump { 0% { transform: scale(1.12); color: var(--gain); } 100% { transform: none; } }
.iconbtn { background: var(--steel); border: 1px solid var(--line); border-radius: var(--radius); padding: 6px 10px; cursor: pointer; color: var(--muted); font-size: 13px; }
.iconbtn[aria-pressed="true"] { color: var(--sodium); border-color: var(--sodium); }

/* ---------------------------------------------------------------- layout */
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 18px; align-items: start; }
@media (max-width: 900px) { .layout { grid-template-columns: minmax(0, 1fr); } }

.stage { position: relative; min-width: 0; }
.stage.shake { animation: shake .45s cubic-bezier(.36, .07, .19, .97); }
@keyframes shake {
  10%, 90% { transform: translate(-1px, 0); } 20%, 80% { transform: translate(3px, 1px); }
  30%, 50%, 70% { transform: translate(-5px, -1px); } 40%, 60% { transform: translate(5px, 1px); }
}
.stage-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.stage-head h2 { font-family: var(--font-display); font-weight: 800; font-size: 26px; letter-spacing: .04em; margin: 0; text-wrap: balance; }
.stage-head .sub { color: var(--muted); font-size: 14px; }

/* ---------------------------------------------------------------- auction lots */
.lots { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px; }
.lot { background: var(--steel); border: 1px solid var(--line); border-radius: var(--radius); display: flex; flex-direction: column; overflow: hidden; }
.lot .box {
  --c: #8b4a2b;
  position: relative; height: 92px; padding: 10px 12px;
  background:
    repeating-linear-gradient(90deg, rgba(0,0,0,.22) 0 3px, rgba(255,255,255,.05) 3px 6px, transparent 6px 14px),
    linear-gradient(180deg, color-mix(in srgb, var(--c) 100%, white 8%), color-mix(in srgb, var(--c) 100%, black 30%));
  border-bottom: 3px solid rgba(0,0,0,.35);
}
.lot .code { font-family: var(--font-display); font-weight: 800; font-size: 20px; letter-spacing: .08em; color: rgba(255,255,255,.88); text-shadow: 0 1px 0 rgba(0,0,0,.4); }
.lot .spec { font-family: var(--font-num); font-size: 12px; letter-spacing: .12em; color: rgba(255,255,255,.7); }
.lot .tierbadge { position: absolute; right: 10px; top: 10px; font-family: var(--font-num); font-size: 11px; letter-spacing: .14em; background: rgba(0,0,0,.35); padding: 2px 7px; border-radius: 3px; }
.lot .body { padding: 12px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
.lot h3 { margin: 0; font-size: 17px; font-weight: 600; }
.lot .blurb { margin: 0; color: var(--muted); font-size: 13px; min-height: 2.9em; }
.peek { display: grid; gap: 2px; background: #0a1319; padding: 4px; border-radius: 4px; }
.peek .pc { aspect-ratio: 1; border-radius: 2px; background: #3b2a20; display: grid; place-items: center; font-size: 10px; overflow: hidden; }
.peek .pc.seen { background: color-mix(in srgb, var(--rc) 35%, #0a1319); box-shadow: inset 0 0 0 1px var(--rc); }
.peek .pc.outline { box-shadow: inset 0 0 0 1px rgba(160, 220, 255, .35); }
.peek-label { font-family: var(--font-num); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.odds { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: #0a1319; }
.odds span { display: block; height: 100%; }
.odds-legend { display: flex; flex-wrap: wrap; gap: 4px 10px; font-family: var(--font-num); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.odds-legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; vertical-align: 0; }
.lot .buy { margin-top: auto; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  background: var(--sodium); color: var(--sodium-ink); border: 0; border-radius: var(--radius);
  padding: 10px 14px; font-weight: 700; cursor: pointer; font-family: var(--font-num); font-size: 17px; letter-spacing: .04em;
  transition: transform .08s ease, filter .15s ease;
}
.btn:hover { filter: brightness(1.08); }
.btn:active { transform: translateY(1px); }
.btn[disabled] { background: var(--steel-hi); color: var(--muted); cursor: not-allowed; filter: none; }
.btn.ghost { background: transparent; color: var(--fog); border: 1px solid var(--line); }
.btn.wide { width: 100%; }

/* ---------------------------------------------------------------- the open container */
.yard { display: flex; flex-direction: column; gap: 12px; }
.meter { display: flex; gap: 18px; flex-wrap: wrap; font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.meter div { display: flex; flex-direction: column; }
.meter .k { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.meter .v { font-size: 26px; font-weight: 700; line-height: 1.1; }
.meter .v.gain { color: var(--gain); } .meter .v.loss { color: var(--loss); }

.frame {
  position: relative; padding: 14px; border-radius: 8px;
  background:
    repeating-linear-gradient(90deg, rgba(0,0,0,.25) 0 3px, rgba(255,255,255,.04) 3px 6px, transparent 6px 16px),
    linear-gradient(180deg, color-mix(in srgb, var(--c, #8b4a2b) 90%, white 5%), color-mix(in srgb, var(--c, #8b4a2b) 80%, black 35%));
  box-shadow: 0 18px 40px rgba(0,0,0,.45), inset 0 0 0 2px rgba(0,0,0,.35);
}
.frame .stencil { position: absolute; left: 16px; top: -2px; transform: translateY(-100%); font-family: var(--font-display); font-weight: 800; letter-spacing: .1em; font-size: 15px; color: var(--muted); }
.grid {
  position: relative; display: grid; gap: 0;
  grid-template-columns: repeat(var(--cols), 1fr);
  grid-template-rows: repeat(var(--rows), 1fr);
  aspect-ratio: var(--cols) / var(--rows);
  width: min(100%, calc(var(--cols) * 78px));
  margin: 0 auto;
  background: #120d0a; border-radius: 4px; overflow: hidden;
  touch-action: none; user-select: none; -webkit-user-select: none; cursor: crosshair;
}
.item {
  position: relative; display: grid; place-items: center;
  background: radial-gradient(circle at 50% 45%, color-mix(in srgb, var(--rc) 38%, #141c22), #10161b 75%);
  box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--rc) 70%, transparent);
  font-size: calc(min(var(--iw), var(--ih)) * 34px);
  line-height: 1; z-index: 1;
}
.item .glyph { filter: drop-shadow(0 2px 4px rgba(0,0,0,.5)); }
.item.revealed { animation: pop .45s cubic-bezier(.2, 1.6, .4, 1); }
.item.revealed.r-epic, .item.revealed.r-legendary { box-shadow: inset 0 0 0 2px var(--rc), 0 0 22px color-mix(in srgb, var(--rc) 70%, transparent); z-index: 3; }
.item.sold { opacity: .35; filter: grayscale(.8); }
.item .tag { position: absolute; left: 3px; bottom: 3px; font-family: var(--font-num); font-size: 12px; font-weight: 700; background: rgba(0,0,0,.6); padding: 0 5px; border-radius: 3px; color: var(--fog); font-variant-numeric: tabular-nums; }
.item .keep { position: absolute; right: 3px; top: 3px; font-size: 12px; }
@keyframes pop { 0% { transform: scale(.7); } 100% { transform: none; } }

.tiles { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(var(--cols), 1fr); grid-template-rows: repeat(var(--rows), 1fr); z-index: 4; pointer-events: none; }
.tile {
  --hp: 1;
  border: 1px solid rgba(0,0,0,.35);
  background:
    radial-gradient(circle at 20% 30%, rgba(255, 170, 110, .18) 0 12%, transparent 13%),
    radial-gradient(circle at 70% 65%, rgba(40, 18, 8, .45) 0 18%, transparent 19%),
    radial-gradient(circle at 45% 80%, rgba(210, 120, 60, .25) 0 9%, transparent 10%),
    linear-gradient(135deg, #7a3b1d, #5a2a15 55%, #6d3519);
  opacity: calc(.55 + var(--hp) * .45);
  transition: opacity .12s linear, transform .12s ease;
}
.tile.hit { transform: scale(.94); }
.tile.gone { opacity: 0; transform: scale(.6); transition: opacity .18s ease-out, transform .18s ease-out; }
.tile.glint { animation: glint 1.6s ease-in-out infinite; }
@keyframes glint {
  0%, 100% { box-shadow: inset 0 0 0 0 transparent; }
  50% { box-shadow: inset 0 0 14px 2px var(--gc); }
}
.xray { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(var(--cols), 1fr); grid-template-rows: repeat(var(--rows), 1fr); z-index: 5; pointer-events: none; }
.xray div { border: 1px dashed rgba(160, 220, 255, .45); margin: 3px; border-radius: 3px; }

.fx { position: fixed; inset: 0; pointer-events: none; z-index: 50; }
.flash { position: fixed; inset: 0; pointer-events: none; z-index: 49; opacity: 0; background: radial-gradient(circle at 50% 45%, var(--fc, #fff), transparent 70%); }
.flash.on { animation: flash .7s ease-out; }
@keyframes flash { 0% { opacity: .55; } 100% { opacity: 0; } }
.float { position: fixed; z-index: 51; pointer-events: none; font-family: var(--font-num); font-weight: 700; font-size: 20px; color: var(--fc); text-shadow: 0 2px 6px rgba(0,0,0,.7); animation: rise 1.1s ease-out forwards; white-space: nowrap; }
.float.big { font-size: 34px; }
@keyframes rise { 0% { transform: translate(-50%, 0) scale(.8); opacity: 0; } 15% { opacity: 1; transform: translate(-50%, -10px) scale(1.05); } 100% { transform: translate(-50%, -70px); opacity: 0; } }
.banner { position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%); z-index: 20; pointer-events: none; text-align: center; animation: banner 1.8s ease-out forwards; }
.banner b { display: block; font-family: var(--font-display); font-weight: 800; font-size: clamp(34px, 7vw, 64px); letter-spacing: .06em; color: var(--bc); text-shadow: 0 0 30px color-mix(in srgb, var(--bc) 60%, transparent), 0 4px 0 rgba(0,0,0,.5); }
.banner span { font-family: var(--font-num); font-size: 20px; color: var(--fog); }
@keyframes banner { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.6); } 12% { opacity: 1; transform: translate(-50%, -50%) scale(1.08); } 25% { transform: translate(-50%, -50%) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -60%); } }

.finds { display: flex; flex-direction: column; gap: 6px; }
.find { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 8px; align-items: center; background: var(--steel); border-left: 3px solid var(--rc); border-radius: 4px; padding: 6px 10px; font-size: 14px; }
.find .n { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.find .n small { color: var(--muted); margin-left: 6px; }
.find .val { font-family: var(--font-num); font-weight: 700; font-variant-numeric: tabular-nums; }
.find .ico { font-size: 20px; text-align: center; }
.find.col { background: color-mix(in srgb, var(--sodium) 10%, var(--steel)); }

/* ---------------------------------------------------------------- tally */
.tally { position: absolute; inset: 0; z-index: 30; display: grid; place-items: center; padding: 16px; background: rgba(8, 14, 18, .72); backdrop-filter: blur(2px); }
.tally .card { width: min(520px, 100%); background: var(--steel); border: 1px solid var(--line); border-radius: 10px; padding: 18px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 30px 60px rgba(0,0,0,.5); max-height: 100%; overflow: auto; }
@media (max-width: 900px) {
  .tally { position: fixed; z-index: 45; align-items: end; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
  .tally .card { max-height: calc(100% - 32px); }
}
.tally h3 { margin: 0; font-family: var(--font-display); font-weight: 800; letter-spacing: .05em; font-size: 24px; }
.tally .rows { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tally .rows div { background: var(--night); border-radius: 6px; padding: 10px; display: flex; flex-direction: column; }
.tally .rows .k { font-family: var(--font-num); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.tally .rows .v { font-family: var(--font-num); font-size: clamp(20px, 5vw, 30px); font-weight: 700; font-variant-numeric: tabular-nums; }
.tally .verdict { font-family: var(--font-num); font-size: 18px; }
.tally .cashline { color: var(--muted); font-size: 13px; }
.tally.loss .card { animation: dud .5s ease-out; }
@keyframes dud { 0% { transform: rotate(-1.5deg) scale(.96); } 40% { transform: rotate(1deg); } 100% { transform: none; } }
.keeps { display: flex; flex-direction: column; gap: 6px; }
.keeprow { display: flex; align-items: center; gap: 10px; background: var(--night); border-radius: 6px; padding: 8px 10px; font-size: 14px; }
.keeprow label { display: flex; gap: 8px; align-items: center; cursor: pointer; flex: 1; min-width: 0; }
.keeprow small { color: var(--muted); }

/* ---------------------------------------------------------------- clipboard panel */
.panel { background: var(--steel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; min-width: 0; }
.tabs { display: flex; border-bottom: 1px solid var(--line); }
.tabs button { flex: 1; background: none; border: 0; padding: 11px 6px; cursor: pointer; font-family: var(--font-num); font-size: 14px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); border-bottom: 2px solid transparent; }
.tabs button[aria-selected="true"] { color: var(--fog); border-bottom-color: var(--sodium); }
.tabpane { padding: 12px; display: flex; flex-direction: column; gap: 12px; max-height: calc(100vh - 150px); overflow: auto; }
@media (max-width: 900px) { .tabpane { max-height: none; } }
.goal { background: color-mix(in srgb, var(--sodium) 9%, var(--night)); border: 1px solid color-mix(in srgb, var(--sodium) 40%, var(--line)); border-radius: 6px; padding: 10px; font-size: 13px; display: flex; flex-direction: column; gap: 6px; }
.goal b { font-weight: 600; }
.bar { height: 6px; background: var(--night); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--sodium); width: 0; transition: width .25s linear; }
.cat { font-family: var(--font-num); font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); margin-top: 4px; }
.up { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px; border-radius: 6px; background: var(--night); }
.up .ico { font-size: 20px; text-align: center; }
.up .t { font-weight: 600; font-size: 14px; }
.up .d { color: var(--muted); font-size: 12.5px; line-height: 1.35; }
.up .pips { font-family: var(--font-num); font-size: 12px; color: var(--sodium); letter-spacing: .06em; }
.up .btn { padding: 7px 10px; font-size: 15px; min-width: 84px; }
.up.locked { opacity: .55; }
.up.maxed .btn { background: transparent; color: var(--gain); }
.prestige { border: 1px dashed var(--line); border-radius: 6px; padding: 10px; display: flex; flex-direction: column; gap: 8px; font-size: 13px; }
.prestige h4 { margin: 0; font-size: 15px; }
.col-card { background: var(--night); border-radius: 6px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.col-card header { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.col-card .reward { color: var(--muted); font-size: 12.5px; }
.col-card.done { box-shadow: inset 0 0 0 1px var(--gain); }
.slots { display: flex; flex-wrap: wrap; gap: 6px; }
.slot { width: 44px; height: 44px; border-radius: 6px; display: grid; place-items: center; font-size: 22px; background: var(--steel); box-shadow: inset 0 0 0 1px var(--rc); position: relative; }
.slot.empty { font-size: 15px; color: var(--muted); font-family: var(--font-num); }
.log { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
.log li { display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px solid var(--line); padding-bottom: 6px; font-variant-numeric: tabular-nums; }
.log .gain { color: var(--gain); } .log .loss { color: var(--loss); }
.footer { color: var(--muted); font-size: 12.5px; display: flex; gap: 16px; flex-wrap: wrap; }
.toast { position: fixed; left: 50%; top: calc(14px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); background: var(--steel-hi); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; z-index: 60; font-size: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.4); max-width: calc(100% - 32px); }
.hint { color: var(--muted); font-size: 13px; text-align: center; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

/* ---------------------------------------------------------------- auction */
.lotmeta { display: flex; flex-wrap: wrap; gap: 4px 12px; font-family: var(--font-num); font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.peek.big { max-width: 420px; }
.peek.big .pc { font-size: clamp(14px, 3.4vw, 24px); }
.peek .pc.mine { outline: 2px dashed var(--sodium); outline-offset: -2px; }
.auction { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 700px) { .auction { grid-template-columns: minmax(0, 1fr); } }
.bidleft, .bidright { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.bidnow { background: var(--steel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; }
.bidnow .k { font-family: var(--font-num); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.bidnow .v { font-family: var(--font-num); font-weight: 700; font-size: 40px; line-height: 1.05; font-variant-numeric: tabular-nums; }
.bidnow .who { font-size: 14px; color: var(--muted); }
.bidnow .who.you { color: var(--sodium); font-weight: 600; }
.bidbtns { display: grid; grid-template-columns: 2fr 1fr; gap: 8px; }
.rivals { display: flex; flex-direction: column; gap: 6px; }
.rival { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 10px; align-items: center; background: var(--steel); border-radius: 6px; padding: 8px 10px; border-left: 3px solid var(--line); }
.rival .face { font-size: 26px; text-align: center; }
.rival .rt { display: flex; flex-direction: column; min-width: 0; }
.rival .rt b { font-size: 14px; }
.rival .tell { font-size: 13.5px; font-style: italic; }
.rival small { color: var(--muted); font-size: 12px; }
.rival.m-confident { border-left-color: var(--loss); }
.rival.m-neutral { border-left-color: var(--sodium); }
.rival.m-nervous { border-left-color: var(--gain); }
.rival.m-out { opacity: .5; }
.rival.holding { box-shadow: inset 0 0 0 1px var(--sodium); }
.chip { font-family: var(--font-num); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; background: var(--sodium); color: var(--sodium-ink); border-radius: 3px; padding: 1px 6px; }
.chip.out { background: var(--steel-hi); color: var(--muted); }
.bidlog { list-style: none; margin: 0; padding: 0; font-size: 13px; color: var(--muted); display: flex; flex-direction: column; gap: 3px; font-variant-numeric: tabular-nums; }
.bidlog li { display: flex; justify-content: space-between; }
.bidlog li.you { color: var(--sodium); }
.passcard { max-width: 520px; margin: 0 auto; background: var(--steel); border: 1px solid var(--line); border-radius: 10px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.passcard h3 { margin: 0; font-family: var(--font-display); font-weight: 800; letter-spacing: .04em; font-size: 22px; text-wrap: balance; }
.passcard .rows { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.passcard .rows div { background: var(--night); border-radius: 6px; padding: 10px; display: flex; flex-direction: column; }
.passcard .rows .k { font-family: var(--font-num); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.passcard .rows .v { font-family: var(--font-num); font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
.passcard .verdict { margin: 0; font-size: 15px; }
.missed { display: flex; flex-wrap: wrap; gap: 6px; }
.missed .mi { width: 40px; height: 40px; display: grid; place-items: center; font-size: 22px; border-radius: 6px; background: var(--night); box-shadow: inset 0 0 0 2px var(--rc); }

/* ---------------------------------------------------------------- door beat */
.doors { position: absolute; inset: 0; z-index: 8; perspective: 900px; cursor: pointer; }
.door { position: absolute; top: 0; bottom: 0; width: 50%;
  background: repeating-linear-gradient(90deg, rgba(0,0,0,.25) 0 3px, rgba(255,255,255,.05) 3px 6px, transparent 6px 14px),
              linear-gradient(180deg, color-mix(in srgb, var(--c) 100%, white 6%), color-mix(in srgb, var(--c) 100%, black 35%));
  transition: transform .9s cubic-bezier(.5, 0, .2, 1); box-shadow: inset 0 0 0 2px rgba(0,0,0,.4); }
.door.l { left: 0; transform-origin: left center; }
.door.r { right: 0; transform-origin: right center; }
.door .bar { position: absolute; top: 8%; bottom: 8%; width: 5px; border-radius: 3px; background: linear-gradient(180deg, #c9ced2, #7c858c); }
.door.l .bar:first-child { right: 22%; } .door.l .bar:last-child { right: 10%; }
.door.r .bar:first-child { left: 22%; } .door.r .bar:last-child { left: 10%; }
.doors.open .door.l { transform: rotateY(-105deg); }
.doors.open .door.r { transform: rotateY(105deg); }
.sweep { position: absolute; inset: 0; opacity: 0; background: radial-gradient(circle at var(--x, 0%) 50%, rgba(255, 236, 190, .35), transparent 32%); }
.doors.open .sweep { animation: sweep 1.1s ease-in-out .3s forwards; }
@keyframes sweep { 0% { opacity: 1; --x: 0%; } 100% { opacity: 0; --x: 100%; } }
@property --x { syntax: "<percentage>"; inherits: false; initial-value: 0%; }

/* ---------------------------------------------------------------- contracts */
.contracts { display: flex; flex-direction: column; gap: 8px; }
.contracts .cat { margin-top: 0; }
.contract { background: var(--night); border-radius: 6px; padding: 8px 10px; display: flex; flex-direction: column; gap: 5px; font-size: 13.5px; }
.contract .ct { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.contract .ct b { font-family: var(--font-num); color: var(--gain); white-space: nowrap; font-variant-numeric: tabular-nums; }
.contract small { color: var(--muted); font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.contract .bar i { background: var(--gain); }

<script>
/* Game rules. Must match sim/engine.py exactly for the same seed (see sim/test_parity.py).
 * Classic script: attaches to window.DS in the browser, module.exports in Node. */
(function (root) {
  "use strict";
  var RARITIES = ["junk", "common", "rare", "epic", "legendary"];

  // ------------------------------------------------------------ random numbers
  function Mulberry32(seed) { this.a = seed >>> 0; }
  Mulberry32.prototype.next = function () {
    this.a = (this.a + 0x6D2B79F5) >>> 0;
    var a = this.a;
    var t = Math.imul(a ^ (a >>> 15), 1 | a) >>> 0;
    t = ((t + Math.imul(t ^ (t >>> 7), 61 | t)) >>> 0) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };

  function weightedIndex(weights, u) {
    var total = 0, i;
    for (i = 0; i < weights.length; i++) total += weights[i];
    var x = u * total, last = 0;
    for (i = 0; i < weights.length; i++) {
      if (weights[i] <= 0) continue;
      last = i;
      x -= weights[i];
      if (x < 0) return i;
    }
    return last;
  }

  function roundHalfUp(x) { return Math.floor(x + 0.5); }

  // ------------------------------------------------------------ data helpers
  function indexData(raw) {
    var d = {
      config: raw.config,
      containers: raw.containers.containers,
      items: raw.items.items,
      baseStats: raw.upgrades.baseStats,
      categories: raw.upgrades.categories,
      upgrades: raw.upgrades.upgrades,
      collections: raw.collections.collections,
      auction: raw.rivals.auction,
      rivals: raw.rivals.rivals,
      contracts: raw.contracts,
      containerById: {}, itemById: {}, upgradeById: {}, collectionOfItem: {}
    };
    d.containers.forEach(function (c) { d.containerById[c.id] = c; });
    d.items.forEach(function (i) { d.itemById[i.id] = i; });
    d.upgrades.forEach(function (u) { d.upgradeById[u.id] = u; });
    d.collections.forEach(function (col) {
      col.items.forEach(function (iid) { d.collectionOfItem[iid] = col.id; });
    });
    return d;
  }

  function pool(d, container) {
    var t = container.itemTier;
    return d.items.filter(function (i) { return i.tiers[0] <= t && t <= i.tiers[1]; });
  }

  function buyableContainers(d) {
    return d.containers.filter(function (c) { return !c.safetyNetOnly; });
  }

  // ------------------------------------------------------------ rules
  function rarityWeights(d, container, luck) {
    var cfg = d.config.luck;
    return RARITIES.map(function (r) {
      var mult = Math.max(cfg.minMult, 1 + luck * cfg.perLevel[r]);
      return container.rarityWeights[r] * mult;
    });
  }

  /* Fill the grid. cells[i] = index into items of the item covering cell i. */
  function generate(d, container, luck, seed) {
    var rng = new Mulberry32(seed);
    var cols = container.cols, rows = container.rows, n = cols * rows, i, j, tmp;
    var order = [];
    for (i = 0; i < n; i++) order.push(i);
    for (i = n - 1; i > 0; i--) {
      j = Math.floor(rng.next() * (i + 1));
      tmp = order[i]; order[i] = order[j]; order[j] = tmp;
    }
    var p = pool(d, container);
    var weights = rarityWeights(d, container, luck);
    var conditions = d.config.conditions;
    var condWeights = conditions.map(function (c) { return c.weight; });
    var cells = [], items = [];
    for (i = 0; i < n; i++) cells.push(-1);

    function fits(x, y, w, h) {
      if (x + w > cols || y + h > rows) return false;
      for (var dy = 0; dy < h; dy++)
        for (var dx = 0; dx < w; dx++)
          if (cells[(y + dy) * cols + (x + dx)] !== -1) return false;
      return true;
    }

    for (var k = 0; k < n; k++) {
      var cell = order[k];
      if (cells[cell] !== -1) continue;
      var x = cell % cols, y = Math.floor(cell / cols);
      var rarity = RARITIES[weightedIndex(weights, rng.next())];
      var cands = p.filter(function (it) { return it.rarity === rarity && fits(x, y, it.w, it.h); });
      var item = cands[weightedIndex(cands.map(function (it) { return it.weight == null ? 1 : it.weight; }), rng.next())];
      var cond = conditions[weightedIndex(condWeights, rng.next())];
      var idx = items.length;
      items.push({ id: item.id, x: x, y: y, w: item.w, h: item.h, rarity: rarity,
                   condition: cond.id, value: item.value * cond.mult });
      for (var dy = 0; dy < item.h; dy++)
        for (var dx = 0; dx < item.w; dx++) cells[(y + dy) * cols + (x + dx)] = idx;
    }
    return { cells: cells, items: items };
  }

  function upgradeCost(upgrade, level) {
    var c = upgrade.cost;
    if (c.list) return c.list[level];
    return roundHalfUp(c.base * Math.pow(c.growth, level));
  }

  function requirementsMet(upgrade, levels) {
    return (upgrade.requires || []).every(function (r) { return (levels[r.id] || 0) >= r.level; });
  }

  function computeStats(d, levels, completed, stars) {
    var s = {};
    Object.keys(d.baseStats).forEach(function (k) { s[k] = d.baseStats[k]; });
    d.upgrades.forEach(function (u) {
      var lv = levels[u.id] || 0;
      if (lv) s[u.stat] += u.perLevel * lv;
    });
    d.collections.forEach(function (col) {
      if (completed && completed.indexOf(col.id) !== -1) s[col.reward.stat] += col.reward.add;
    });
    s.sellTotal = s.sellMult + (stars || 0) * d.config.prestige.sellBonusPerStar;
    return s;
  }

  function prestigeStars(d, lifetime) {
    return Math.floor(Math.sqrt(Math.max(0, lifetime) / d.config.prestige.earningsPerStarSquared));
  }

  var evCache = {};
  function expectedValue(d, containerId, luck, samples) {
    samples = samples || d.config.evSamples;
    var key = containerId + "|" + luck + "|" + samples;
    if (evCache[key] != null) return evCache[key];
    var c = d.containerById[containerId], total = 0;
    for (var s = 0; s < samples; s++) {
      var g = generate(d, c, luck, 1000003 + s);
      for (var i = 0; i < g.items.length; i++) total += g.items[i].value;
    }
    return (evCache[key] = total / samples);
  }

  function crewIncomePerSec(d, stats) {
    if (stats.crew <= 0) return 0;
    var tier = Math.min(stats.crewTier, stats.tierAccess);
    var c = buyableContainers(d).filter(function (c) { return c.tier === tier; })[0];
    var profit = expectedValue(d, c.id, stats.luck) * stats.sellTotal - c.price;
    return stats.crew * Math.max(0, profit) / d.config.crew.secondsPerContainer;
  }

  // ------------------------------------------------------------ auction (mirrors sim/engine.py)
  function niceRound(x) {
    if (x <= 0) return 0;
    var e = String(Math.floor(x)).length - 2;
    if (e >= 0) { var step = Math.pow(10, e); return roundHalfUp(x / step) * step; }
    var mult = Math.pow(10, -e);
    return roundHalfUp(x * mult) / mult;
  }

  function peekCells(container, seed, n) {
    var rng = new Mulberry32((seed ^ 0x5BD1E995) >>> 0);
    var cells = [], out = [];
    for (var i = 0; i < container.cols * container.rows; i++) cells.push(i);
    for (var k = 0; k < Math.min(n, container.cols * container.rows); k++) {
      var j = Math.floor(rng.next() * cells.length);
      out.push(cells.splice(j, 1)[0]);
    }
    return out;
  }

  function normal(rng) { return (rng.next() + rng.next() + rng.next() - 1.5) * 2.0; }

  function auctionSetup(d, container, gen, seed) {
    var a = d.auction, guide = container.price, tiles = container.cols * container.rows;
    var base = peekCells(container, seed, container.peekTiles);
    var avgTile = expectedValue(d, container.id, 0) / tiles;
    var seen = 0;
    for (var i = 0; i < base.length; i++) {
      var it = gen.items[gen.cells[base[i]]];
      seen += it.value / (it.w * it.h);
    }
    var ratio = base.length ? seen / (avgTile * base.length) : 1.0;
    var signal = Math.min(a.signalClamp[1], Math.max(a.signalClamp[0], (ratio - 1) * a.signalScale));
    var rng = new Mulberry32((seed ^ 0x9E3779B9) >>> 0);
    var pool = d.rivals.filter(function (r) { return r.minTier <= container.tier; });
    var count = a.minRivals + Math.floor(rng.next() * (a.maxRivals - a.minRivals + 1));
    var rivals = [];
    var picks = Math.min(count, pool.length);
    for (var k = 0; k < picks; k++) {
      var r = pool.splice(Math.floor(rng.next() * pool.length), 1)[0];
      var z = normal(rng);
      var mx = guide * r.mult * (1 + r.signalWeight * signal) * Math.max(0.3, 1 + r.spread * z);
      rivals.push({ id: r.id, max: mx });
    }
    return { opening: niceRound(guide * a.openingRatio), increment: niceRound(guide * a.incrementRatio),
             signal: signal, rivals: rivals };
  }

  function nextRaiser(setup, nextBid, last) {
    var n = setup.rivals.length;
    for (var k = 1; k <= n; k++) {
      var i = (last + k) % n;
      if (setup.rivals[i].max >= nextBid) return i;
    }
    return -1;
  }

  function auctionOutcome(setup, willingness) {
    var step = 0, bid = setup.opening, last = -1;
    if (willingness < bid) return { won: false, price: null };
    for (;;) {
      var nxt = setup.opening + (step + 1) * setup.increment;
      var i = nextRaiser(setup, nxt, last);
      if (i < 0) return { won: true, price: bid };
      last = i; step += 1; bid = nxt;
      var mine = setup.opening + (step + 1) * setup.increment;
      if (mine > willingness) return { won: false, price: bid };
      step += 1; bid = mine;
    }
  }

  var api = {
    RARITIES: RARITIES, Mulberry32: Mulberry32, weightedIndex: weightedIndex,
    roundHalfUp: roundHalfUp, indexData: indexData, pool: pool,
    buyableContainers: buyableContainers, rarityWeights: rarityWeights, generate: generate,
    upgradeCost: upgradeCost, requirementsMet: requirementsMet, computeStats: computeStats,
    prestigeStars: prestigeStars, expectedValue: expectedValue, crewIncomePerSec: crewIncomePerSec,
    niceRound: niceRound, peekCells: peekCells, auctionSetup: auctionSetup, nextRaiser: nextRaiser,
    auctionOutcome: auctionOutcome
  };
  if (typeof module !== "undefined" && module.exports) module.exports = api;
  else { root.DS = root.DS || {}; root.DS.rules = api; }
})(this);

</script>
<script>
/* Game state and actions. Pure logic, no DOM. Emits events through `on(fn)`.
 * Balance numbers all come from data (window.DOCKSIDE_DATA). */
(function (root) {
  "use strict";
  var R = (typeof module !== "undefined" && module.exports) ? require("./rules.js") : root.DS.rules;
  var SAVE_KEY = "dockside-save-v1";
  var LOT_COUNT = 3;

  function Game(rawData, opts) {
    opts = opts || {};
    this.d = R.indexData(rawData);
    this.listeners = [];
    this.storage = opts.storage || null;
    this.reset(opts.seed != null ? opts.seed : (Date.now() >>> 0));
  }

  Game.prototype.reset = function (seed) {
    this.s = {
      version: 1,
      money: this.d.config.startMoney,
      lifetime: 0,           // earnings this business (resets on prestige)
      totalEarned: 0,        // all-time, never resets
      levels: {},
      collected: [],         // item ids placed in the collection book (persist)
      completed: [],         // collection ids completed (persist)
      stars: 0,
      rngState: seed >>> 0,
      lots: [],
      current: null,
      bidding: null,
      contracts: [],
      history: [],           // last few tallies
      stats: { opened: 0, best: null, found: { junk: 0, common: 0, rare: 0, epic: 0, legendary: 0 } }
    };
    this.refreshLots();
    this.fillContracts();
  };

  Game.prototype.on = function (fn) { this.listeners.push(fn); };
  Game.prototype.emit = function (type, payload) {
    for (var i = 0; i < this.listeners.length; i++) this.listeners[i](type, payload || {});
  };

  Game.prototype.nextSeed = function () {
    var rng = new R.Mulberry32(this.s.rngState);
    var v = Math.floor(rng.next() * 4294967296) >>> 0;
    this.s.rngState = rng.a;
    return v;
  };

  Game.prototype.stats = function () {
    return R.computeStats(this.d, this.s.levels, this.s.completed, this.s.stars);
  };

  // ------------------------------------------------------------ auction
  Game.prototype.availableContainers = function () {
    var access = this.stats().tierAccess;
    return R.buyableContainers(this.d).filter(function (c) { return c.tier <= access; });
  };

  /* Lots: the best unlocked classes, newest first, so the next step up is always visible. */
  Game.prototype.refreshLots = function () {
    var avail = this.availableContainers().slice().reverse();
    var lots = [];
    for (var i = 0; i < LOT_COUNT; i++) {
      var c = avail[Math.min(i, avail.length - 1)];
      lots.push({ containerId: c.id, seed: this.nextSeed(), serial: 100000 + (this.nextSeed() % 900000) });
    }
    this.s.lots = lots;
    this.emit("lots");
  };

  Game.prototype.lotPreview = function (lot) {
    var c = this.d.containerById[lot.containerId];
    var st = this.stats();
    var g = R.generate(this.d, c, st.luck, lot.seed);
    var peek = R.peekCells(c, lot.seed, c.peekTiles + st.peekBonus);
    var auction = c.sale === "auction" ? R.auctionSetup(this.d, c, g, lot.seed) : null;
    return { container: c, gen: g, peek: peek, basePeek: c.peekTiles, auction: auction };
  };

  Game.prototype.canAfford = function (amount) { return this.s.money >= amount; };

  Game.prototype.safetyNetAvailable = function () {
    var cheapest = Math.min.apply(null, this.availableContainers().map(function (c) { return c.price; }));
    return !this.s.current && !this.s.bidding && this.s.money < cheapest;
  };

  /* A sold lot is replaced in place by a fresh lot of the same class, so the mix of
   * classes on offer stays the same. */
  Game.prototype.replaceLot = function (index) {
    var old = this.s.lots[index];
    this.s.lots[index] = { containerId: old.containerId, seed: this.nextSeed(), serial: 100000 + (this.nextSeed() % 900000) };
    this.emit("lots");
  };

  /* Fixed-price lots (the yard gate). Auction lots go through openBidding. */
  Game.prototype.buyLot = function (index) {
    if (this.s.current || this.s.bidding) return false;
    var lot = this.s.lots[index];
    var p = this.lotPreview(lot);
    if (p.auction || !this.canAfford(p.container.price)) return false;
    this.s.money -= p.container.price;
    this.startContainer(p.container, p.gen, p.peek, lot.serial, p.container.price);
    this.replaceLot(index);
    this.save();
    return true;
  };

  // ------------------------------------------------------------ live auction
  /* s.bidding: { lot, step, bid, holder: "you" | rival index | null, last, log } */
  Game.prototype.openBidding = function (index) {
    if (this.s.current || this.s.bidding) return false;
    var p = this.lotPreview(this.s.lots[index]);
    if (!p.auction) return false;
    this.s.bidding = { lot: index, step: -1, bid: p.auction.opening, holder: null, last: -1, log: [] };
    this.emit("bidding");
    return true;
  };

  Game.prototype.biddingInfo = function () {
    var b = this.s.bidding; if (!b) return null;
    var lot = this.s.lots[b.lot], p = this.lotPreview(lot), a = p.auction;
    var nextBid = b.step < 0 ? a.opening : a.opening + (b.step + 1) * a.increment;
    return { lot: lot, preview: p, setup: a, nextBid: nextBid, bidding: b };
  };

  /* Honest tells: coarse headroom between a rival's private maximum and the next bid. */
  Game.prototype.rivalMood = function (rivalIndex) {
    var info = this.biddingInfo(), r = info.setup.rivals[rivalIndex];
    var next = info.bidding.step < 0 ? info.setup.opening : info.nextBid;
    if (r.max < next) return "out";
    var head = (r.max - next) / info.preview.container.price, t = this.d.auction.tells;
    return head > t.confident ? "confident" : head < t.nervous ? "nervous" : "neutral";
  };

  Game.prototype.playerBid = function () {
    var info = this.biddingInfo(); if (!info) return false;
    var b = info.bidding;
    if (b.holder === "you" || !this.canAfford(info.nextBid)) return false;
    b.step += 1; b.bid = info.nextBid; b.holder = "you";
    b.log.unshift({ who: "you", amount: b.bid });
    this.emit("bid", { who: "you", amount: b.bid });
    return true;
  };

  /* Called by the UI after a short pause. Returns "raised", "won" or null. */
  Game.prototype.rivalTurn = function () {
    var info = this.biddingInfo(); if (!info || info.bidding.holder !== "you") return null;
    var b = info.bidding, a = info.setup;
    var nxt = a.opening + (b.step + 1) * a.increment;
    var i = R.nextRaiser(a, nxt, b.last);
    if (i < 0) { this.winBidding(); return "won"; }
    b.step += 1; b.bid = nxt; b.holder = i; b.last = i;
    b.log.unshift({ who: i, amount: nxt });
    this.emit("bid", { who: i, amount: nxt });
    return "raised";
  };

  Game.prototype.winBidding = function () {
    var info = this.biddingInfo(), b = info.bidding, p = info.preview;
    this.s.money -= b.bid;
    this.s.bidding = null;
    this.emit("hammer", { toYou: true, amount: b.bid });
    this.startContainer(p.container, p.gen, p.peek, info.lot.serial, b.bid);
    this.replaceLot(b.lot);
    this.save();
  };

  /* Walk away: the lot goes to the best rival, and you get to see what was inside. */
  Game.prototype.passBidding = function () {
    var info = this.biddingInfo(); if (!info || info.bidding.holder === "you") return null;
    var b = info.bidding, a = info.setup, p = info.preview;
    var winner = -1, price = b.bid;
    if (b.holder === null) {
      var order = a.rivals.map(function (r, i) { return i; }).sort(function (x, y) { return a.rivals[y].max - a.rivals[x].max; });
      if (a.rivals[order[0]].max >= a.opening) {
        winner = order[0];
        var second = order.length > 1 ? a.rivals[order[1]].max : 0, step = 0;
        while (a.opening + (step + 1) * a.increment <= second) step++;
        price = a.opening + step * a.increment;
      }
    } else winner = b.holder;
    var inside = p.gen.items.reduce(function (sum, it) { return sum + it.value; }, 0) * this.stats().sellTotal;
    var result = { winner: winner, price: winner < 0 ? 0 : price, inside: inside, containerId: p.container.id,
                   rivalId: winner < 0 ? null : a.rivals[winner].id, gen: p.gen };
    this.s.bidding = null;
    this.replaceLot(b.lot);
    this.emit("passed", result);
    this.save();
    return result;
  };

  Game.prototype.takeScrapPile = function () {
    if (!this.safetyNetAvailable()) return false;
    var c = this.d.containerById[this.d.config.safetyNet.containerId];
    var g = R.generate(this.d, c, this.stats().luck, this.nextSeed());
    this.startContainer(c, g, [], 0, 0);
    this.save();
    return true;
  };

  Game.prototype.startContainer = function (c, gen, peek, serial, paid) {
    var n = c.cols * c.rows, hp = [], i;
    for (i = 0; i < n; i++) hp.push(c.rustHp);
    this.s.current = {
      containerId: c.id, price: paid, guide: c.price, serial: serial, gen: gen, hp: hp,
      itemState: gen.items.map(function () { return { revealed: false, sold: false, kept: false }; }),
      tally: null, done: false
    };
    this.emit("start", { container: c });
    for (i = 0; i < peek.length; i++) this.damage(peek[i], c.rustHp, true);
  };

  // ------------------------------------------------------------ scraping
  /* Player scrapes at a tile: brush pattern around it, scrape power per tile. */
  Game.prototype.scrape = function (cell) {
    var cur = this.s.current;
    if (!cur || cur.done) return;
    var c = this.d.containerById[cur.containerId];
    var st = this.stats();
    var patterns = this.d.config.scraping.brushPatterns;
    var pat = patterns[Math.min(st.brush, patterns.length - 1)];
    var x0 = cell % c.cols, y0 = Math.floor(cell / c.cols);
    for (var i = 0; i < pat.length; i++) {
      var x = x0 + pat[i][0], y = y0 + pat[i][1];
      if (x < 0 || y < 0 || x >= c.cols || y >= c.rows) continue;
      this.damage(y * c.cols + x, st.scrapePower, false);
    }
  };

  Game.prototype.damage = function (cell, amount, silent) {
    var cur = this.s.current;
    if (!cur || cur.hp[cell] <= 0) return;
    cur.hp[cell] = Math.max(0, cur.hp[cell] - amount);
    this.emit("tile", { cell: cell, hp: cur.hp[cell], silent: silent });
    if (cur.hp[cell] > 0) return;
    var idx = cur.gen.cells[cell];
    var it = cur.gen.items[idx];
    var c = this.d.containerById[cur.containerId];
    // Item revealed once all its tiles are clear.
    for (var dy = 0; dy < it.h; dy++)
      for (var dx = 0; dx < it.w; dx++)
        if (cur.hp[(it.y + dy) * c.cols + (it.x + dx)] > 0) return;
    this.revealItem(idx, silent);
  };

  Game.prototype.revealItem = function (idx, silent) {
    var cur = this.s.current;
    var st = this.itemState(idx);
    if (st.revealed) return;
    st.revealed = true;
    var it = cur.gen.items[idx];
    var sale = it.value * this.stats().sellTotal;
    this.s.stats.found[it.rarity]++;
    var colId = this.d.collectionOfItem[it.id];
    var keptHere = cur.gen.items.some(function (other, j) { return j !== idx && other.id === it.id && cur.itemState[j].kept; });
    var forCollection = !!colId && this.s.collected.indexOf(it.id) === -1 && !keptHere;
    if (forCollection) st.kept = true;
    this.emit("reveal", { index: idx, item: it, def: this.d.itemById[it.id], sale: sale,
                          forCollection: forCollection, silent: silent });
    if (cur.price > 0) {
      this.contractProgress("find_rarity", { rarity: it.rarity });
      this.contractProgress("condition", { condition: it.condition });
    }
    if (!forCollection && it.rarity === "junk" && this.stats().autoSellJunk) this.sellItem(idx, true);
    this.checkDone();
  };

  Game.prototype.itemState = function (idx) { return this.s.current.itemState[idx]; };

  /* Value of everything revealed so far: what sold items actually fetched, plus what the
   * rest would fetch now. Kept (collection) items count at their sale value. */
  Game.prototype.foundValue = function () {
    var cur = this.s.current; if (!cur) return 0;
    var mult = this.stats().sellTotal, total = 0;
    for (var i = 0; i < cur.gen.items.length; i++) {
      var st = cur.itemState[i];
      if (!st.revealed) continue;
      total += st.sold ? st.soldFor : cur.gen.items[i].value * mult;
    }
    return total;
  };

  /* Cash the player actually gets from this container if they finish now. */
  Game.prototype.cashValue = function () {
    var cur = this.s.current; if (!cur) return 0;
    var mult = this.stats().sellTotal, total = 0;
    for (var i = 0; i < cur.gen.items.length; i++) {
      var st = cur.itemState[i];
      if (!st.revealed) continue;
      if (st.sold) total += st.soldFor;
      else if (!st.kept) total += cur.gen.items[i].value * mult;
    }
    return total;
  };

  Game.prototype.checkDone = function () {
    var cur = this.s.current;
    if (cur.done) return;
    for (var i = 0; i < cur.hp.length; i++) if (cur.hp[i] > 0) return;
    cur.done = true;
    var found = this.foundValue();
    var tally = { containerId: cur.containerId, paid: cur.price, found: found,
                  profit: found - cur.price, serial: cur.serial };
    cur.tally = tally;
    this.s.stats.opened++;
    if (cur.price > 0 && (!this.s.stats.best || tally.profit > this.s.stats.best.profit)) this.s.stats.best = tally;
    this.s.history.unshift(tally);
    this.s.history = this.s.history.slice(0, 8);
    this.emit("done", tally);
    if (cur.price > 0) {
      this.contractProgress("open_class", { containerId: cur.containerId });
      this.contractProgress("profit", { profit: tally.profit });
    }
  };

  /* Auto-scraper: called by the UI loop with a target chooser for cosmetics. */
  Game.prototype.autoScrape = function (hits, pickCell) {
    var cur = this.s.current;
    if (!cur || cur.done) return;
    var power = this.stats().scrapePower;
    for (var h = 0; h < hits; h++) {
      var open = [];
      for (var i = 0; i < cur.hp.length; i++) if (cur.hp[i] > 0) open.push(i);
      if (!open.length) return;
      this.damage(pickCell(open), power, false);
    }
  };

  // ------------------------------------------------------------ selling
  Game.prototype.sellItem = function (idx, auto) {
    var cur = this.s.current, st = this.itemState(idx);
    if (!st.revealed || st.sold) return 0;
    var it = cur.gen.items[idx];
    var sale = it.value * this.stats().sellTotal;
    st.sold = true; st.kept = false; st.soldFor = sale;
    this.earn(sale);
    this.emit("sold", { index: idx, sale: sale, auto: !!auto });
    return sale;
  };

  Game.prototype.toggleKeep = function (idx) {
    var cur = this.s.current, st = this.itemState(idx);
    var it = cur.gen.items[idx];
    if (st.sold || !this.d.collectionOfItem[it.id] || this.s.collected.indexOf(it.id) !== -1) return;
    // Only one copy per collection slot: keeping this one releases any other copy.
    if (!st.kept) cur.gen.items.forEach(function (other, j) { if (j !== idx && other.id === it.id) cur.itemState[j].kept = false; });
    st.kept = !st.kept;
    this.emit("keep", { index: idx, kept: st.kept });
  };

  /* Close the container: sell everything not kept, file kept items into collections. */
  Game.prototype.finishContainer = function () {
    var cur = this.s.current;
    if (!cur || !cur.done) return null;
    var sold = 0, filed = [];
    for (var i = 0; i < cur.gen.items.length; i++) {
      var st = cur.itemState[i], it = cur.gen.items[i];
      if (st.kept && this.s.collected.indexOf(it.id) === -1) {
        this.s.collected.push(it.id);
        filed.push(it.id);
      } else if (!st.sold) {
        sold += this.sellItem(i, true);
      }
    }
    var newlyCompleted = [];
    var self = this;
    this.d.collections.forEach(function (col) {
      if (self.s.completed.indexOf(col.id) !== -1) return;
      if (col.items.every(function (id) { return self.s.collected.indexOf(id) !== -1; })) {
        self.s.completed.push(col.id);
        newlyCompleted.push(col);
      }
    });
    this.s.current = null;
    if (filed.length) this.contractProgress("file", { count: filed.length });
    this.emit("finished", { sold: sold, filed: filed, completed: newlyCompleted });
    this.save();
    return { sold: sold, filed: filed, completed: newlyCompleted };
  };

  Game.prototype.earn = function (amount) {
    this.s.money += amount;
    this.s.lifetime += amount;
    this.s.totalEarned += amount;
  };

  // ------------------------------------------------------------ port contracts
  Game.prototype.bestClass = function () {
    var a = this.availableContainers();
    return a[a.length - 1];
  };

  Game.prototype.fillContracts = function () {
    var cfg = this.d.contracts;
    if (!this.s.contracts) this.s.contracts = [];
    while (this.s.contracts.length < cfg.active) {
      var taken = this.s.contracts.map(function (c) { return c.tpl; });
      var free = cfg.templates.filter(function (t) { return taken.indexOf(t.id) === -1; });
      var rng = new R.Mulberry32(this.nextSeed());
      var t = free[Math.floor(rng.next() * free.length)];
      var best = this.bestClass();
      this.s.contracts.push({
        tpl: t.id, progress: 0, n: t.n, classId: best.id,
        amount: t.profitGuideMult ? R.niceRound(best.price * t.profitGuideMult) : 0,
        reward: R.niceRound(best.price * t.rewardGuideMult)
      });
    }
  };

  Game.prototype.contractText = function (c) {
    var t = this.d.contracts.templates.filter(function (x) { return x.id === c.tpl; })[0];
    return t.text.replace("{n}", c.n).replace("{class}", this.d.containerById[c.classId].name)
      .replace("{amount}", "$" + Math.round(c.amount).toLocaleString("en-US"));
  };

  Game.prototype.contractProgress = function (type, detail) {
    var self = this, rarOrder = R.RARITIES, changed = false;
    (this.s.contracts || []).forEach(function (c) {
      var t = self.d.contracts.templates.filter(function (x) { return x.id === c.tpl; })[0];
      if (t.type !== type) return;
      var hit = false;
      if (type === "find_rarity") hit = rarOrder.indexOf(detail.rarity) >= rarOrder.indexOf(t.rarity);
      else if (type === "condition") hit = detail.condition === t.condition;
      else if (type === "open_class") hit = detail.containerId === c.classId;
      else if (type === "profit") hit = detail.profit >= c.amount;
      else if (type === "file") hit = true;
      if (hit) { c.progress = Math.min(c.n, c.progress + (detail.count || 1)); changed = true; }
    });
    if (!changed) return;
    var done = this.s.contracts.filter(function (c) { return c.progress >= c.n; });
    if (done.length) {
      this.s.contracts = this.s.contracts.filter(function (c) { return c.progress < c.n; });
      done.forEach(function (c) { self.earn(c.reward); self.emit("contract", { contract: c, text: self.contractText(c) }); });
      this.fillContracts();
    }
    this.emit("contracts");
  };

  // ------------------------------------------------------------ upgrades
  Game.prototype.upgradeInfo = function (u) {
    var lv = this.s.levels[u.id] || 0;
    var maxed = lv >= u.maxLevel;
    return {
      level: lv, maxed: maxed,
      cost: maxed ? null : R.upgradeCost(u, lv),
      unlocked: R.requirementsMet(u, this.s.levels),
      nextName: u.levelNames && !maxed ? u.levelNames[lv] : null
    };
  };

  Game.prototype.buyUpgrade = function (id) {
    var u = this.d.upgradeById[id], info = this.upgradeInfo(u);
    if (this.s.bidding) return false;   // cash is committed while you're bidding
    if (info.maxed || !info.unlocked || !this.canAfford(info.cost)) return false;
    var beforeAccess = this.stats().tierAccess;
    this.s.money -= info.cost;
    this.s.levels[id] = info.level + 1;
    this.emit("upgrade", { upgrade: u, level: info.level + 1 });
    if (this.stats().tierAccess !== beforeAccess && !this.s.bidding) this.refreshLots();
    else if (u.stat === "luck" || u.stat === "peekBonus") this.emit("lots");
    this.save();
    return true;
  };

  /* The cheapest thing the player can't afford yet: always show a next goal. */
  Game.prototype.nextGoal = function () {
    var best = null, self = this;
    this.d.upgrades.forEach(function (u) {
      var info = self.upgradeInfo(u);
      if (info.maxed || !info.unlocked || self.canAfford(info.cost)) return;
      if (!best || info.cost < best.cost) best = { upgrade: u, cost: info.cost };
    });
    return best;
  };

  // ------------------------------------------------------------ idle income and prestige
  Game.prototype.crewRate = function () { return R.crewIncomePerSec(this.d, this.stats()); };

  Game.prototype.tick = function (dt) {
    var rate = this.crewRate();
    if (rate > 0) this.earn(rate * dt);
  };

  Game.prototype.prestigePreview = function () {
    return R.prestigeStars(this.d, this.s.lifetime);
  };

  Game.prototype.prestige = function () {
    var gain = this.prestigePreview();
    if (gain < 1 || this.s.current || this.s.bidding) return false;
    this.s.stars += gain;
    this.s.money = this.d.config.startMoney;
    this.s.lifetime = 0;
    this.s.levels = {};
    this.s.contracts = [];
    this.refreshLots();
    this.fillContracts();
    this.emit("prestige", { gain: gain, stars: this.s.stars });
    this.save();
    return true;
  };

  // ------------------------------------------------------------ save
  Game.prototype.save = function () {
    if (!this.storage) return;
    try { this.storage.setItem(SAVE_KEY, JSON.stringify(this.s)); } catch (e) { /* storage unavailable */ }
  };

  Game.prototype.load = function () {
    if (!this.storage) return false;
    try {
      var raw = this.storage.getItem(SAVE_KEY);
      if (!raw) return false;
      var s = JSON.parse(raw);
      if (!s || s.version !== 1) return false;
      this.s = s;
      if (!this.s.lots || !this.s.lots.length) this.refreshLots();
      this.fillContracts();
      return true;
    } catch (e) { return false; }
  };

  Game.prototype.wipe = function () {
    try { if (this.storage) this.storage.removeItem(SAVE_KEY); } catch (e) { /* ignore */ }
    this.reset(Date.now() >>> 0);
    this.emit("wipe");
  };

  if (typeof module !== "undefined" && module.exports) module.exports = Game;
  else { root.DS = root.DS || {}; root.DS.Game = Game; }
})(this);

</script>
<script>
/* Synthesised sound (no audio files). Starts only after the first user gesture. */
(function (root) {
  "use strict";
  var ctx = null, master = null, enabled = true, noiseBuf = null;

  function ensure() {
    if (!enabled) return null;
    if (!ctx) {
      var AC = root.AudioContext || root.webkitAudioContext;
      if (!AC) return null;
      ctx = new AC();
      master = ctx.createGain();
      master.gain.value = 0.5;
      master.connect(ctx.destination);
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 0.5, ctx.sampleRate);
      var data = noiseBuf.getChannelData(0);
      for (var i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
    }
    if (ctx.state === "suspended") ctx.resume();
    return ctx;
  }

  function tone(freq, start, dur, type, gain, glideTo) {
    var c = ensure(); if (!c) return;
    var t = c.currentTime + (start || 0);
    var o = c.createOscillator(), g = c.createGain();
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, t);
    if (glideTo) o.frequency.exponentialRampToValueAtTime(glideTo, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain || 0.2, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + 0.05);
  }

  function noise(start, dur, freq, q, gain) {
    var c = ensure(); if (!c) return;
    var t = c.currentTime + (start || 0);
    var src = c.createBufferSource(); src.buffer = noiseBuf;
    var f = c.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = freq; f.Q.value = q || 1;
    var g = c.createGain();
    g.gain.setValueAtTime(gain || 0.2, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(master);
    src.start(t, Math.random() * 0.3); src.stop(t + dur + 0.02);
  }

  var lastScrape = 0;
  var S = {
    setEnabled: function (on) { enabled = on; if (!on && ctx) ctx.suspend(); if (on) ensure(); },
    isEnabled: function () { return enabled; },
    unlock: function () { ensure(); },
    scrape: function () {
      var now = performance.now();
      if (now - lastScrape < 45) return;
      lastScrape = now;
      noise(0, 0.07, 1800 + Math.random() * 1600, 1.4, 0.10);
    },
    chip: function () { noise(0, 0.05, 3800, 3, 0.08); tone(900 + Math.random() * 300, 0, 0.04, "square", 0.02); },
    buy: function () { noise(0, 0.25, 300, 0.8, 0.25); tone(110, 0, 0.3, "sawtooth", 0.05, 70); },
    // Reveal sounds scale with rarity: junk is a dull thud, legendary is a fanfare.
    reveal: function (rarity) {
      switch (rarity) {
        case "junk": tone(160, 0, 0.12, "triangle", 0.12, 120); break;
        case "common": tone(520, 0, 0.14, "triangle", 0.12); break;
        case "rare": tone(784, 0, 0.18, "sine", 0.16); tone(1175, 0.06, 0.22, "sine", 0.12); break;
        case "epic":
          [659, 831, 988, 1319].forEach(function (f, i) { tone(f, i * 0.07, 0.3, "triangle", 0.14); });
          break;
        case "legendary":
          [523, 659, 784, 1047, 1319, 1568].forEach(function (f, i) { tone(f, i * 0.08, 0.5, "triangle", 0.16); });
          tone(2093, 0.5, 0.9, "sine", 0.08);
          noise(0.45, 0.8, 6000, 0.7, 0.05);
          break;
      }
    },
    // Rising tone while the last tile of a big item is about to go.
    charge: function () { tone(220, 0, 0.45, "sawtooth", 0.05, 880); },
    cash: function () { tone(1568, 0, 0.08, "square", 0.05); tone(2093, 0.07, 0.18, "square", 0.05); noise(0, 0.12, 5000, 2, 0.05); },
    dud: function () { tone(330, 0, 0.25, "sawtooth", 0.07, 220); tone(247, 0.22, 0.45, "sawtooth", 0.07, 150); },
    fanfare: function () { [392, 523, 659, 784].forEach(function (f, i) { tone(f, i * 0.1, 0.35, "triangle", 0.12); }); },
    gavel: function () { noise(0, 0.06, 900, 1.2, 0.25); tone(210, 0, 0.08, "triangle", 0.12, 150); },
    hammer: function () {
      noise(0, 0.09, 700, 1, 0.35); tone(160, 0, 0.14, "triangle", 0.2, 100);
      noise(0.28, 0.09, 700, 1, 0.35); tone(160, 0.28, 0.14, "triangle", 0.2, 100);
      noise(0.62, 0.14, 500, 0.8, 0.5); tone(120, 0.62, 0.3, "triangle", 0.25, 70);
    },
    doors: function () { noise(0, 0.5, 260, 0.7, 0.18); tone(70, 0, 0.6, "sawtooth", 0.05, 55); },
    click: function () { tone(1200, 0, 0.03, "square", 0.03); }
  };
  root.DS = root.DS || {};
  root.DS.audio = S;
})(this);

(function (root) {
  "use strict";
  var DS = root.DS, A = DS.audio;
  var doc = root.document;

    b.textContent = gain < 1 ? "Not worth selling yet" : g.s.current ? "Finish this container first" : "Sell the business for +" + gain + " ★";
  };

  UI.prototype.updateGoal = function () {
    if (!this.goalEl) return;
    var goal = this.g.nextGoal();
    this.goalEl.innerHTML = "";
    if (!goal) { this.goalEl.appendChild(h("b", { text: "Everything affordable is yours. Open bigger containers!" })); return; }
    var pct = Math.max(0, Math.min(100, this.g.s.money / goal.cost * 100));
    this.goalEl.appendChild(h("div", {}, [h("b", { text: "Next goal: " }), goal.upgrade.icon + " " + goal.upgrade.name + " — " + money(goal.cost)]));
    var bar = h("div", { class: "bar" }, [h("i", { style: "width:" + pct + "%" })]);
    this.goalEl.appendChild(bar);
  };

  UI.prototype.updateAffordability = function () {
    var g = this.g;
    (this.upButtons || []).forEach(function (o) {
      var info = g.upgradeInfo(o.u);
      o.btn.disabled = info.maxed || !info.unlocked || !g.canAfford(info.cost) || !!g.s.bidding;
    });
    this.updateGoal();
    this.updatePrestige();
  };

  UI.prototype.renderCollections = function () {
    var self = this, g = this.g;
    this.pane.appendChild(h("div", { class: "d", style: "color:var(--muted);font-size:13px", text: "Keep the first copy of each item to complete a set. Rewards are permanent, even after you sell the business." }));
    this.d.collections.forEach(function (col) {
      var have = col.items.filter(function (id) { return g.s.collected.indexOf(id) !== -1; }).length;
      var done = g.s.completed.indexOf(col.id) !== -1;
      var slots = h("div", { class: "slots" });
      col.items.forEach(function (id) {
        var def = self.d.itemById[id], got = g.s.collected.indexOf(id) !== -1;
        slots.appendChild(h("div", { class: "slot" + (got ? "" : " empty"), style: "--rc:" + self.rarityColor(def.rarity), title: def.name + (got ? "" : " (not found yet)") }, [got ? def.icon : "?"]));
      });
      self.pane.appendChild(h("div", { class: "col-card" + (done ? " done" : "") }, [
        h("header", {}, [h("b", { text: col.icon + " " + col.name }), h("span", { class: "pips", style: "font-family:var(--font-num)", text: have + " / " + col.items.length })]),
        h("div", { class: "reward", text: (done ? "Complete: " : "Reward: ") + col.reward.text }),
        slots,
        h("div", { class: "reward", text: col.items.map(function (id) { return self.d.itemById[id].name; }).join(" · ") })
      ]));
    });
  };

  UI.prototype.renderLog = function () {
    var self = this, list = h("ul", { class: "log" });
    if (!this.g.s.history.length) list.appendChild(h("li", { text: "No containers opened yet. Buy your first lot." }));
    this.g.s.history.forEach(function (t) {
      var c = self.d.containerById[t.containerId];
      list.appendChild(h("li", {}, [h("span", { text: c.name + (t.serial ? " · " + containerCode(c.tier, t.serial) : "") }),
        h("span", { class: t.profit >= 0 ? "gain" : "loss", text: (t.profit >= 0 ? "+" : "") + money(t.profit) })]));
    });
    this.pane.appendChild(list);
  };

  UI.prototype.toast = function (text) {
    var old = doc.querySelector(".toast"); if (old) old.remove();
    var t = h("div", { class: "toast", role: "status", text: text });
    doc.body.appendChild(t);
    setTimeout(function () { t.remove(); }, 3200);
  };

  // ------------------------------------------------------------------ frame loop
  UI.prototype.loop = function () {
    var self = this, last = performance.now(), acc = 0, autoAcc = 0, saveAcc = 0;
    function frame(now) {
      var dt = Math.min(0.1, (now - last) / 1000); last = now;
      self.g.tick(dt);
      var st = self.g.stats();
      if (st.autoScrape > 0 && self.g.s.current && !self.g.s.current.done) {
        autoAcc += st.autoScrape * dt;
        var hits = Math.floor(autoAcc);
        if (hits > 0) {
          autoAcc -= hits;
          self.g.autoScrape(hits, function (open) { return open[Math.floor(Math.random() * open.length)]; });
        }
      }
      fxStep(dt);
      acc += dt; saveAcc += dt;
      if (acc > 0.25) { acc = 0; self.renderTop(); if (self.tab === "upgrades") self.updateAffordability(); }
      if (saveAcc > 5) { saveAcc = 0; self.g.save(); }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  };

  DS.UI = UI;
  DS.fmt = { money: money, containerCode: containerCode };
})(this);

</script>
<script>
/* Boot: load data, restore the save, start the UI. */
(function (root) {
  "use strict";
  var DS = root.DS;

  function safeStorage() {
    try {
      var k = "__dockside_probe";
      root.localStorage.setItem(k, "1");
      root.localStorage.removeItem(k);
      return root.localStorage;
    } catch (e) { return null; }
  }

  function start(hotData) {
    var game = new DS.Game(root.DOCKSIDE_DATA, { storage: safeStorage() });
    if (hotData && hotData.state) game.s = hotData.state;
    else game.load();
    var ui = new DS.UI(game, document.getElementById("app"));
    ui.loop();
    // Save when the tab is hidden or closed (mobile browsers may kill background tabs).
    document.addEventListener("visibilitychange", function () { if (document.visibilityState === "hidden") game.save(); });
    root.addEventListener("pagehide", function () { game.save(); });
    root.dockside = { game: game, ui: ui };   // handy for debugging and tests
    if (root.claude && root.claude.hot && root.claude.hot.snapshot) {
      root.claude.hot.snapshot(function () { return { state: game.s }; });
    }
  }

  if (root.claude && root.claude.hot && root.claude.hot.ready) root.claude.hot.ready(start);
  else start(root.claude && root.claude.hot ? root.claude.hot.data : null);
})(this);

</script>
